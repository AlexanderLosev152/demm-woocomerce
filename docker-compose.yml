services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: my-site
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - '3310:3306'

  wordpress:
    image: wordpress:latest
    depends_on:
      - mysql
    ports:
      - '8001:80'
    restart: always
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: my-site
      WORDPRESS_DEBUG: 1
    command: ["sh", "-c", "umask 0000; exec apache2-foreground"]
    volumes:
      - wordpress_data:/var/www/html
      - ./my-theme:/var/www/html/wp-content/themes
      - ./my-plugins:/var/www/html/wp-content/plugins
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - mysql
    ports:
      - '8181:80'
    environment:
      PMA_HOST: mysql
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress


volumes:
  wordpress_data:
